<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maniananth M — Python Backend Engineer & Full-Stack Architect</title>
  <meta name="description" content="Portfolio of Maniananth M, Software Engineer specialized in high-concurrency Python & FastAPI backends, Generative AI & RAG workflows, PostgreSQL/MySQL, and Flutter client applications.">
  <meta name="keywords" content="Maniananth M, Python Backend Engineer, FastAPI Developer, Django, Generative AI, RAG, pgvector, PostgreSQL, Flutter Developer, SPI Equipments, Software Engineer Portfolio">
  <meta name="author" content="Maniananth M">
  <meta name="theme-color" content="#0a0c10">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://maniananth-portfolio.web.app/">
  <meta property="og:title" content="Maniananth M — Python Backend Engineer & Full-Stack Architect">
  <meta property="og:description" content="Commercial experience building high-concurrency FastAPI microservices, real-time WebSocket pipelines, and production Flutter client applications.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Maniananth M">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0a0c10;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0a0c10;
      color: #2dd4bf;
      font-family: monospace;
      z-index: 99999;
      transition: opacity 0.4s ease-out;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(45, 212, 191, 0.15);
      border-top-color: #2dd4bf;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="spinner"></div>
    <div style="font-size: 14px; letter-spacing: 0.1em; color: #94a3b8;">INITIALIZING FLUTTER WEB ENGINE...</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() { loader.remove(); }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
